name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: forge-1-20-1
            java: |
              17
              21
            required_tests: 27
          - module: neoforge-1-21-1
            java: 21
            required_tests: 25
          - module: neoforge-26-1-2
            java: 25
            required_tests: 23
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Shared grid regressions
        if: matrix.module == 'neoforge-1-21-1'
        run: |
          chmod +x ./gradlew
          ./gradlew :common:check --console=plain --no-daemon --max-workers=2
      - name: Compile, test and build
        working-directory: ${{ matrix.module }}
        run: |
          chmod +x ./gradlew
          ./gradlew compileJava test build --console=plain --no-daemon --max-workers=2
      - name: Server regressions with WTLib, Extended Crafting and Re Avaritia
        working-directory: ${{ matrix.module }}
        env:
          REQUIRED_TESTS: ${{ matrix.required_tests }}
        run: |
          set -euo pipefail
          ./gradlew runGameTestServer --console=plain --no-daemon --max-workers=2 2>&1 | tee gametest.log
          for mod in ae2wtlib extendedcrafting avaritia; do
            grep -E "with \{([^}]*,)?${mod}(,[^}]*)?\} mods| \(${mod}\)[[:space:]]*$" gametest.log
          done
          grep -F "All ${REQUIRED_TESTS} required tests passed" gametest.log
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ matrix.module }}
          path: |
            ${{ matrix.module }}/gametest.log
            ${{ matrix.module }}/build/test-results/
            ${{ matrix.module }}/run*/logs/
