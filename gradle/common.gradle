tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

def commonJavaSourceDir = layout.projectDirectory.dir('../common/src/main/java').asFile
def commonResourcesSourceDir = layout.projectDirectory.dir('../common/src/main/resources').asFile
def loaderResourceDirs = [file('src/main/resources'), file('src/generated/resources')]
def generatedCommonJavaDir = layout.buildDirectory.dir('generated/sources/extendedTerminalCommon/java')
def generatedCommonResourcesDir = layout.buildDirectory.dir('generated/resources/extendedTerminalCommon')

def syncExtendedTerminalCommonJava = tasks.register('syncExtendedTerminalCommonJava', Sync) {
    from commonJavaSourceDir
    into generatedCommonJavaDir
}

def syncExtendedTerminalCommonResources = tasks.register('syncExtendedTerminalCommonResources', Sync) {
    from commonResourcesSourceDir
    into generatedCommonResourcesDir
    inputs.files(loaderResourceDirs.collect { fileTree(it) })
            .withPropertyName('loaderResourceOverrides').withPathSensitivity(PathSensitivity.RELATIVE)
    exclude { details ->
        !details.directory && loaderResourceDirs.any { new File(it, details.relativePath.pathString).isFile() }
    }
}

def generatedCommonJavaSources = files(generatedCommonJavaDir).builtBy(syncExtendedTerminalCommonJava)
def generatedCommonResources = files(generatedCommonResourcesDir).builtBy(syncExtendedTerminalCommonResources)

sourceSets {
    main {
        java.srcDir generatedCommonJavaSources
        resources.srcDir generatedCommonResources
        resources.srcDir 'src/generated/resources'
    }
}

tasks.named('compileJava').configure {
    dependsOn syncExtendedTerminalCommonJava
}

tasks.named('processResources').configure {
    dependsOn syncExtendedTerminalCommonResources
    // Shared files overridden by either loader resource tree are excluded during sync.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.matching { it.name in ['genIntellijRuns', 'neoForgeIdeSync', 'idea', 'ideaModule'] }.configureEach {
    dependsOn syncExtendedTerminalCommonJava
    dependsOn syncExtendedTerminalCommonResources
}

idea {
    module {
        sourceDirs += generatedCommonJavaDir.get().asFile
        generatedSourceDirs += generatedCommonJavaDir.get().asFile
        resourceDirs += generatedCommonResourcesDir.get().asFile
    }
}

tasks.withType(Jar).configureEach {
    exclude 'me/myogoo/extendedterminal/gametest/**'
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.version.toString(),
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }
}
