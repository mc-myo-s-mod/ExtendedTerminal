plugins {
    id 'base'
    id 'idea'
}

def loadProjectProperties = { Project target ->
    def propertiesFile = target.file('gradle.properties')
    if (!propertiesFile.isFile()) {
        return
    }

    def properties = new Properties()
    propertiesFile.withInputStream { properties.load(it) }
    properties.each { key, value ->
        def propertyName = key.toString()
        if (!target.hasProperty(propertyName)) {
            target.extensions.extraProperties.set(propertyName, value)
        }
    }
}

allprojects {
    loadProjectProperties(project)

    group = findProperty('mod_group_id') ?: 'me.myogoo'
    version = findProperty('mod_version') ?: 'unspecified'

    repositories {
        mavenLocal()
        mavenCentral()
        maven {
            name = 'ModMaven'
            url = "https://modmaven.dev"
            content {
                includeGroup "appeng"
                includeGroup "de.mari_023"
            }
        }
        maven {
            name = 'CurseMaven'
            url = "https://cursemaven.com"
        }
        maven {
            name = 'Modrinth'
            url = "https://api.modrinth.com/maven"
        }
        maven {
            name = 'projectLocal'
            url = rootProject.layout.projectDirectory.dir('repo').asFile.toURI()
        }
    }
}

subprojects {
    if (name == 'neoforge-26-1-2') {
        return
    }

    apply plugin: 'java'
    apply plugin: 'idea'
    apply plugin: 'maven-publish'

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    tasks.withType(Javadoc).configureEach {
        failOnError = false
        options.encoding = 'UTF-8'
        options.addStringOption('charSet', 'UTF-8')
        options.addStringOption('docEncoding', 'UTF-8')
        options.addStringOption('Xdoclint:none', '-quiet')
    }

    tasks.withType(org.gradle.api.publish.tasks.GenerateModuleMetadata).configureEach {
        enabled = false
    }

    idea {
        module {
            downloadSources = true
            downloadJavadoc = true
        }
    }

    publishing {
        repositories {
            maven {
                name = 'projectLocal'
                url = rootProject.layout.projectDirectory.dir('repo').asFile.toURI()
            }
        }
    }

    tasks.register('publishToLocalMaven') {
        group = 'publishing'
        description = 'Publishes the mod jar to the local Maven repository.'
        dependsOn tasks.named('publishToMavenLocal')
    }
}

configure(project(':common')) {
    java {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
    }

    dependencies {
        // Lets the ET common module resolve Myotus common/API classes while editing shared sources.
        compileOnly "me.myogoo:myotus:${project(':neoforge-1-21-1').myotus_version}"
    }

    def checkGridCoordinates = tasks.register('checkGridCoordinates', JavaExec) {
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = 'me.myogoo.extendedterminal.util.GridCoordinateCheck'
        enableAssertions = true
    }
    tasks.named('test') { exclude '**/GridCoordinateCheck.class' }
    tasks.named('check') { dependsOn checkGridCoordinates }
}


tasks.register('syncIntellij') {
    group = 'ide'
    description = 'Prepares IntelliJ metadata and run configurations for all Extended Terminal modules.'
    dependsOn ':forge-1-20-1:genIntellijRuns'
    dependsOn ':neoforge-1-21-1:neoForgeIdeSync'
}

tasks.register('syncIntellij26') {
    group = 'ide'
    description = 'Prepares IntelliJ run configurations with the 26.1.2 Gradle wrapper.'
    dependsOn ':neoforge-26-1-2:neoForgeIdeSync'
}
